apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: petclinic
  labels:
    app: mysql
    component: database
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: petclinic
  labels:
    app: mysql
    component: database
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
