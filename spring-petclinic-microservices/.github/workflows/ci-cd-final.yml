name: CI - Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all services with Maven
        run: mvn package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push config-server
        uses: docker/build-push-action@v6
        with:
          context: ./spring-petclinic-config-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-config-server:latest

      - name: Build and push discovery-server
        uses: docker/build-push-action@v6
        with:
          context: ./spring-petclinic-discovery-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-discovery-server:latest

      - name: Build and push customers-service
        uses: docker/build-push-action@v6
        with:
          context: ./spring-petclinic-customers-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-customers-service:latest

      - name: Build and push visits-service
        uses: docker/build-push-action@v6
        with:
          context: ./spring-petclinic-visits-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-visits-service:latest

      - name: Build and push vets-service
        uses: docker/build-push-action@v6
        with:
          context: ./spring-petclinic-vets-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-vets-service:latest

      - name: Build and push api-gateway
        uses: docker/build-push-action@v6
        with:
          context: ./spring-petclinic-api-gateway
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-api-gateway:latest

      - name: Build and push admin-server
        uses: docker/build-push-action@v6
        with:
          context: ./spring-petclinic-admin-server
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/petclinic-admin-server:latest
